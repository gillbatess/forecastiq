name: Sync to Hugging Face Space

# Every push to main on GitHub is copied to the Hugging Face Space, which then rebuilds the app.
on:
  push:
    branches: [main]
  workflow_dispatch:          # also lets you run it by hand from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # EDIT THIS LINE: <your Hugging Face username>/<your Space name>
      HF_SPACE: gillbatess/forecastiq
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}     # set in GitHub -> Settings -> Secrets and variables -> Actions
        run: |
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
